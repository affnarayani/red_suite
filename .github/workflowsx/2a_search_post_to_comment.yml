name: 2A. Search Post to Comment

on:
  schedule:
    - cron: '0 */3 * * *' # Automatically runs once every 3 hours
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  search-automation:
    runs-on: ubuntu-latest

    # CRITICAL: Permission granted for committing/pushing changes back to repo
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0 # Full history fetch for safe dynamic push

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Configure Git
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Pull Latest Changes (Maintain Persistence)
      run: |
        git pull origin ${GITHUB_REF_NAME} --rebase

    - name: Install and Start Cloudflare WARP (TUN Global Mode)
      run: |
        # 1. Set up repository and GPG key
        curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
        echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list

        # 2. Install
        sudo apt-get update && sudo apt-get install -y cloudflare-warp

        # 3. Start Service
        sudo systemctl start warp-svc
        sleep 2

        # 4. Register (New CLI Syntax compatible)
        warp-cli --accept-tos registration new || warp-cli registration new

        # 5. STRICT FIX: Change mode from PROXY to TUN (Standard VPN)
        # This will route pure GitHub runner internet traffic through WARP
        warp-cli --accept-tos mode warp || warp-cli mode warp

        # 6. Connect
        warp-cli --accept-tos connect || warp-cli connect
        sleep 5

        # 7. Verify if the pure system IP has changed or not
        curl https://cloudflare.com/cdn-cgi/trace

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install chromium --with-deps

    - name: Run Search Script
      env:
        DECRYPT_KEY: ${{ secrets.DECRYPT_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python search_post_to_comment.py

    - name: Commit and Push Status Changes
      if: always() # Always check so that if an eligible post is found, it gets saved
      run: |
        # Pull latest remote state first, taking remote version on conflict
        # This prevents rebase conflicts when multiple workflows edit the same files
        git pull origin ${GITHUB_REF_NAME} --strategy-option=theirs || true

        # Script only modifies or creates json/status.json
        [ -f json/status.json ] && git add json/status.json
        [ -d locators ] && git add locators/

        if git diff --staged --quiet; then
          echo "[INFO] No changes detected in status.json. Skipping push."
        else
          echo "[OK] Eligible post found and recorded. Committing status update..."
          git commit -m "Automated: Fresh target post extracted [skip ci]"
          git push origin ${GITHUB_REF_NAME}
        fi