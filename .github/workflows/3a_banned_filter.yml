name: 3A. Banned Filter

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at 12:00 AM UTC (5:30 AM IST)
  workflow_dispatch: # For manual triggering

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  filter-subreddits:
    runs-on: ubuntu-latest

    # CRITICAL: Grant permission to modify and push files to the repo
    permissions:
      contents: write

    steps:
      # 1. Checkout repository code
      - name: Checkout Repository Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Full history fetch for safe persistent push

      # 2. Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. Configure Git author identity
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # 4. Pull Latest Changes (so it runs on up-to-date code/files)
      - name: Pull Latest Changes
        run: |
          BRANCH_NAME="${GITHUB_REF_NAME:-main}"
          git pull origin "$BRANCH_NAME" --rebase

      # 5. Install and Start Cloudflare WARP (TUN Global Mode)
      - name: Install and Start Cloudflare WARP (TUN Global Mode)
        run: |
          # 1. Set up repository and GPG key
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list

          # 2. Install
          sudo apt-get update && sudo apt-get install -y cloudflare-warp

          # 3. Start Service
          sudo systemctl start warp-svc
          sleep 2

          # 4. Register (New CLI Syntax compatible)
          warp-cli --accept-tos registration new || warp-cli registration new

          # 5. STRICT FIX: Change mode from PROXY to TUN (Standard VPN)
          # This will route pure GitHub runner internet traffic through WARP
          warp-cli --accept-tos mode warp || warp-cli mode warp

          # 6. Connect
          warp-cli --accept-tos connect || warp-cli connect
          sleep 5

          # 7. Verify if the pure system IP has changed or not
          curl https://cloudflare.com/cdn-cgi/trace

      # 6. Install Python packages (all deps from requirements.txt)
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 7. Install Playwright Chromium and configure system deps
      - name: Install Playwright Chromium
        run: |
          playwright install chromium --with-deps

      # 8. Execute the script
      - name: Run Banned Filter Script
        env:
          DECRYPT_KEY: ${{ secrets.DECRYPT_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python banned_filter.py

      # 9. If the process fails, save the error screenshot
      - name: Upload Error Screenshot if script fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: banned-filter-error-screenshot
          path: error/error_screenshot.png
          if-no-files-found: ignore
          retention-days: 7

      # 10. Commit and push updates to subreddits.txt and banned.txt
      - name: Commit and Push Cleaned Lists
        if: always() # Hamesha run hoga taaki agar beech mein partial updates bhi hue hon toh push ho jaye
        run: |
          BRANCH_NAME="${GITHUB_REF_NAME:-main}"

          # Only add files if they were created or modified
          [ -f data/subreddits.txt ] && git add data/subreddits.txt
          [ -f data/banned.txt ] && git add data/banned.txt
          [ -d locators ] && git add locators/

          if git diff --staged --quiet; then
            echo "[INFO] No banned subreddits detected. Files are unchanged. Skipping push."
          else
            echo "[OK] Ban logs updated. Committing and pushing updates..."
            git commit -m "chore: update subreddits list and banned history [skip ci]"
            git pull origin "$BRANCH_NAME" --rebase
            git push origin "$BRANCH_NAME"
          fi