name: 2C. Upvote and Comment

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["2B. Generate Comment"] # When the 'Generate Comment' workflow completes, this will trigger
    types:
      - completed

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write # Grants permission to modify and push json state changes back to the repository

jobs:
  run-automation:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
# 1. Fetch the latest code and state from the repository
          # Full history fetch prevents rebase conflicts
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # 2. Configure Python Environment
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Pull Latest Changes (Maintain Persistence)
        run: |
          git pull origin ${GITHUB_REF_NAME} --rebase

      - name: Install and Start Cloudflare WARP (TUN Global Mode)
        run: |
          # 1. Set up repository and GPG key
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list

          # 2. Install
          sudo apt-get update && sudo apt-get install -y cloudflare-warp

          # 3. Start Service
          sudo systemctl start warp-svc
          sleep 2

          # 4. Register (New CLI Syntax compatible)
          warp-cli --accept-tos registration new || warp-cli registration new

          # 5. STRICT FIX: Change mode from PROXY to TUN (Standard VPN)
          # This will route pure GitHub runner internet traffic through WARP
          warp-cli --accept-tos mode warp || warp-cli mode warp

          # 6. Connect
          warp-cli --accept-tos connect || warp-cli connect
          sleep 5

          # 7. Verify if the pure system IP has changed or not
          curl https://cloudflare.com/cdn-cgi/trace

      # 3. Install required packages from requirements.txt
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Set up Playwright Chromium browser and its system binaries
      - name: Install Playwright and System Dependencies
        run: |
          python -m playwright install --with-deps chromium

      # 5. Run the core automation script (Clean Headless Execution)
      - name: Run Reddit Upvote and Comment Script
        env:
          DECRYPT_KEY: ${{ secrets.DECRYPT_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python upvote_comment.py

      # 6. Commit and Push Any Changes (Safe State Sync)
      - name: Commit and Push Any Changes
        if: always() # Always run so that if a partial run occurred, state gets saved
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH_NAME="${GITHUB_REF_NAME:-main}"

          # 1. Temporarily stash (hide) local changes made by the python script
          git stash

          # 2. Pull down remote updates safely without conflict
          git pull origin "$BRANCH_NAME" --rebase

          # 3. Apply stashed changes back (|| true prevents error if there were no changes)
          git stash pop || true

          # Only stage the intended files
          [ -f json/status.json ] && git add json/status.json
          [ -f json/commented.json ] && git add json/commented.json
          [ -d locators ] && git add locators/

          # Check if there are any staged modifications before performing the commit step
          if git diff --staged --quiet; then
            echo "No new changes to commit."
          else
            git commit -m "chore: update automation history state [skip ci]"
            git pull origin "$BRANCH_NAME" --rebase
            git push origin "$BRANCH_NAME"
          fi