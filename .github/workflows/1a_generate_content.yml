name: 1A. Generate Content

on:
  schedule:
    - cron: '0 0,7,14,21 * * *' # Automatically runs once every 7 hours
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  content-automation:
    runs-on: ubuntu-latest

    # CRITICAL: Grant permission to modify and push files to the repo
    permissions:
      contents: write

    steps:
      # 1. Checkout repository code
      - name: Checkout Repository Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Full history fetch for safe persistent push

      # 2. Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. Configure Git author identity
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # 4. Pull Latest Changes (so it runs on up-to-date code/files)
      - name: Pull Latest Changes
        run: |
          BRANCH_NAME="${GITHUB_REF_NAME:-main}"
          git pull origin "$BRANCH_NAME" --rebase

      # 5. Install and Start Cloudflare WARP (TUN Global Mode)
      - name: Install and Start Cloudflare WARP (TUN Global Mode)
        run: |
          # 1. Set up repository and GPG key
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list

          # 2. Install
          sudo apt-get update && sudo apt-get install -y cloudflare-warp

          # 3. Start Service
          sudo systemctl start warp-svc
          sleep 2

          # 4. Register (New CLI Syntax compatible)
          warp-cli --accept-tos registration new || warp-cli registration new

          # 5. STRICT FIX: Change mode from PROXY to TUN (Standard VPN)
          # This will route pure GitHub runner internet traffic through WARP
          warp-cli --accept-tos mode warp || warp-cli mode warp

          # 6. Connect
          warp-cli --accept-tos connect || warp-cli connect
          sleep 5

          # 7. Verify if the pure system IP has changed or not
          curl https://cloudflare.com/cdn-cgi/trace

      # 6. Install Python packages (all deps from requirements.txt)
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 7. Install Playwright Chromium and configure system deps
      - name: Install Playwright Chromium
        run: |
          playwright install chromium --with-deps

      # 8. Execute Content Generation Script
      - name: Run Content Generation Script
        env:
          DECRYPT_KEY: ${{ secrets.DECRYPT_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python generate_content.py

      # 9. Commit and push updated article and status files
- name: Commit and Push Generated Content and Status
      if: always()
      run: |
        BRANCH_NAME="${GITHUB_REF_NAME:-main}"

        # Pull latest remote state first, taking remote version on conflict
        # This prevents rebase conflicts when multiple workflows edit the same files
        git pull origin "$BRANCH_NAME" --strategy-option=theirs || true

        [ -f json/reddit_post.json ] && git add json/reddit_post.json
        [ -f json/status.json ] && git add json/status.json
        [ -d locators ] && git add locators/

        if git diff --staged --quiet; then
          echo "[INFO] No new generated content found. Files are unchanged. Skipping push."
        else
          echo "[OK] New content generated. Committing and pushing article and status updates..."
          git commit -m "chore: update generated article and status [skip ci]"
          git push origin "$BRANCH_NAME"
        fi