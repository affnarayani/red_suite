name: 2B. Generate Comment

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["2A. Search Post to Comment"]
    types:
      - completed

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-automation:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    # CRITICAL: Permission granted for committing/pushing changes back to repo
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0 # Full history fetch for safe dynamic push

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Configure Git
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Pull Latest Changes (Maintain Persistence)
      run: |
        git pull origin ${GITHUB_REF_NAME} --rebase

    - name: Install and Start Cloudflare WARP (TUN Global Mode)
      run: |
        # 1. Set up repository and GPG key
        curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
        echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list

        # 2. Install
        sudo apt-get update && sudo apt-get install -y cloudflare-warp

        # 3. Start Service
        sudo systemctl start warp-svc
        sleep 2

        # 4. Register (New CLI Syntax compatible)
        warp-cli --accept-tos registration new || warp-cli registration new

        # 5. STRICT FIX: Change mode from PROXY to TUN (Standard VPN)
        # This will route pure GitHub runner internet traffic through WARP
        warp-cli --accept-tos mode warp || warp-cli mode warp

        # 6. Connect
        warp-cli --accept-tos connect || warp-cli connect
        sleep 5

        # 7. Verify if the pure system IP has changed or not
        curl https://cloudflare.com/cdn-cgi/trace

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Script
      env:
        DECRYPT_KEY: ${{ secrets.DECRYPT_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python generate_comment.py

    - name: Upload Error Screenshot
      if: failure() # Run only if python script crashes
      uses: actions/upload-artifact@v4
      with:
        name: playwright-error-screenshot
        path: error/error_screenshot.png
        if-no-files-found: ignore

    - name: Commit and Push Changes (If updated)
      if: always() # Always check so that if status changes, it gets saved
      run: |
        # generate_comment.py only updates json/status.json
        [ -f json/status.json ] && git add json/status.json
        [ -d locators ] && git add locators/

        if git diff --staged --quiet; then
          echo "[INFO] No changes detected in status.json. Skipping push."
        else
          echo "[OK] Changes detected. Committing and pushing updates..."
          git commit -m "Automated: Update comment generation status [skip ci]"
          git pull origin ${GITHUB_REF_NAME} --rebase
          git push origin ${GITHUB_REF_NAME}
        fi